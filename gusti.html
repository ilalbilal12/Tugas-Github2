<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Gusti</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #022c22, #115e59);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 450px;
            padding: 40px;
            text-align: center;
            background: #134e4a;
            border: 2px solid #2dd4bf;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(45,212,191,0.3);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #5eead4;
        }

        .info {
            text-align: left;
            background: #042f2e;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }

        .info p {
            padding: 8px;
            border-bottom: 1px solid #115e59;
        }

        .info b {
            color: #5eead4;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #0d9488;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            background: #14b8a6;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="icon">⚽</div>

        <h1>IDENTITAS GUSTI</h1>

        <div class="info">

            <p><b>Nama:</b> Gusti</p>

            <p><b>Kelas:</b> XI PPLG</p>

            <p><b>Jurusan:</b> PPLG</p>

            <p><b>Hobi:</b> Olahraga</p>

        </div>

        <a href="index.html">
            ← Kembali
        </a>

    </div>

</body>
</html>
