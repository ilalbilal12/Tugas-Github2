<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Gusti</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            /* Lapangan rumput bergaris */
            background:
                repeating-linear-gradient(90deg, #15803d 0 60px, #16a34a 60px 120px);
        }

        .profile {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: #0f172a;
            border: 4px solid #fff;
            border-radius: 20px;
            box-shadow: 0 0 0 6px #f97316, 0 20px 40px rgba(0,0,0,0.4);
        }

        .icons {
            font-size: 44px;
            letter-spacing: 8px;
        }

        h1 {
            margin: 10px 0 0;
            font-size: 34px;
            font-style: italic;
            letter-spacing: 2px;
            color: #fb923c;
            text-transform: uppercase;
        }

        .sub {
            margin: 4px 0 0;
            color: #fde047;
            font-weight: bold;
        }

        .info {
            text-align: left;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 6px solid #fde047;
            margin: 25px 0;
        }

        .info p {
            margin: 0;
            padding: 10px 4px;
            border-bottom: 2px dashed #334155;
        }

        .info p:last-child { border-bottom: none; }

        .info b {
            display: inline-block;
            width: 90px;
            color: #fb923c;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            background: #f97316;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 999px;
            border: 3px solid #fff;
        }

        a:hover,
        a:focus-visible {
            background: #ea580c;
            outline: 3px solid #fde047;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="icons">⚽ 🏀 🏐</div>

        <h1>Identitas Gusti</h1>
        <p class="sub">Pemain Utama Kelas XI PPLG</p>

        <div class="info">
            <p><b>Nama:</b> Gusti</p>
            <p><b>Kelas:</b> XI PPLG</p>
            <p><b>Jurusan:</b> PPLG</p>
            <p><b>Hobi:</b> Olahraga 🏆</p>
        </div>

        <a href="index.html">← Kembali</a>

    </div>

</body>
</html>
