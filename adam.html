<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Adam - Gaming</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #050816;
            background-image:
                radial-gradient(circle at 20% 20%, #172554 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #3b0764 0%, transparent 40%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile {
            width: 450px;
            max-width: 100%;
            padding: 35px;
            text-align: center;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f0ff;
            border-radius: 20px;
            box-shadow:
                0 0 15px #00f0ff,
                0 0 40px rgba(0, 240, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .profile::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(
                90deg, #00f0ff, #a855f7, #00f0ff
            );
        }

        .icon {
            font-size: 75px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px #00f0ff);
        }

        h1 {
            color: #00f0ff;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 12px #00f0ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .info {
            text-align: left;
            background: #0b1120;
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            border: 1px solid #334155;
        }

        .info p {
            padding: 12px;
            margin: 0;
            border-bottom: 1px solid #1e293b;
            transition: 0.3s;
        }

        .info p:last-child {
            border-bottom: none;
        }

        .info p:hover {
            background: #172554;
            padding-left: 18px;
            border-radius: 8px;
        }

        .info b {
            color: #00f0ff;
        }

        a {
            display: inline-block;
            padding: 13px 30px;
            background: linear-gradient(90deg, #0891b2, #7c3aed);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: 0.3s;
        }

        a:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00f0ff;
        }

        .status {
            color: #4ade80;
            font-size: 12px;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .status span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            margin-right: 6px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="icon">🎮</div>

        <h1>IDENTITAS ADAM</h1>

        <div class="subtitle">GAMER PROFILE</div>

        <div class="info">

            <p><b>Nama:</b> Adam</p>

            <p><b>Kelas:</b> XI PPLG</p>

            <p><b>Jurusan:</b> PPLG</p>

            <p><b>Hobi:</b> Gaming 🎮</p>

        </div>

        <a href="index.html">
            ← KEMBALI
        </a>

        <div class="status">
            <span></span> GAMER ONLINE
        </div>

    </div>

</body>
</html>
