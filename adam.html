<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Adam</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1033, #581c87);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 450px;
            padding: 40px;
            text-align: center;
            background: #2e1065;
            border: 2px solid #c084fc;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(192,132,252,0.3);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #d8b4fe;
        }

        .info {
            text-align: left;
            background: #1e1b4b;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }

        .info p {
            padding: 8px;
            border-bottom: 1px solid #4c1d95;
        }

        .info b {
            color: #c084fc;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #9333ea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            background: #a855f7;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="icon">🎮</div>

        <h1>IDENTITAS ADAM</h1>

        <div class="info">

            <p><b>Nama:</b> Adam</p>

            <p><b>Kelas:</b> XI PPLG</p>

            <p><b>Jurusan:</b> PPLG</p>

            <p><b>Hobi:</b> Gaming</p>

        </div>

        <a href="index.html">
            ← Kembali
        </a>

    </div>

</body>
</html>
