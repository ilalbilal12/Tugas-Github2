
<!DOCTYPE html>
<html lang="id">
<head>

    <style>
        body {

            min-height: 100vh;

            display: flex;

            width: 450px;
            padding: 40px;

            font-size: 70px;
        }

        h1 {
            color: #93c5fd;
        }

        .info {
            text-align: left;
            background: #172554;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }

        .info p {
            padding: 8px;
            border-bottom: 1px solid #1e40af;
        }

        .info b {
            color: #93c5fd;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            background: #3b82f6;
        }
    </style>
</head>
