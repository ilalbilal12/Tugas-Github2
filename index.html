<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Identitas Kelompok</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #164e63);
            color: white;
            padding: 50px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            color: #67e8f9;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 45px;
        }

        .members {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 220px;
            padding: 30px 20px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #22d3ee;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.3);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .card h2 {
            color: #67e8f9;
            margin: 10px 0;
        }

        .card p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .card a {
            display: inline-block;
            padding: 11px 20px;
            background: #0891b2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .card a:hover {
            background: #06b6d4;
        }

        footer {
            margin-top: 50px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

        </p>

            <!-- ADAM -->

                </a>
            </div>


            <!-- GUSTI -->

                <div class="icon">⚽</div>

                <h2>Gusti</h2>

                <p>Anggota 3</p>

                <a href="gusti.html">
                    Lihat Identitas
                </a>
            </div>


            <!-- AGUNG -->
            <div class="card">

                <h2>Agung</h2>

                <a href="agung.html">
                    Lihat Identitas
                </a>
            </div>

        </div>

        <footer>
            <p>© 2026 Kelompok Kami</p>
        </footer>

    </div>
