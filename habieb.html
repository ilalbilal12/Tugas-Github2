<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Habieb</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #164e63);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 450px;
            padding: 40px;
            text-align: center;
            background: #1e293b;
            border: 2px solid #22d3ee;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(34,211,238,0.3);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #67e8f9;
        }

        .info {
            text-align: left;
            background: #0f172a;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }

        .info p {
            padding: 8px;
            border-bottom: 1px solid #334155;
        }

        .info b {
            color: #67e8f9;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #0891b2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        a:hover {
            background: #06b6d4;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="icon">💻</div>

        <h1>IDENTITAS HABIEB</h1>

        <div class="info">

            <p>
                <b>Nama:</b> Habieb
            </p>

            <p>
                <b>Kelas:</b> XII PPLG
            </p>

            <p>
                <b>Jurusan:</b> PPLG
            </p>

            <p>
                <b>Hobi:</b> Coding
            </p>

        </div>

        <a href="index.html">
            ← Kembali
        </a>

    </div>

</body>
</html>
